# agentmux.conf — source from ~/.tmux.conf:
#   source-file ~/.agentmux/tmux/agentmux.conf
#

# Let programs in a pane forward an escape to the OUTER terminal via tmux's passthrough envelope
# (DCS tmux; … ST). Used by the notify hook (scripts/tmux-status.sh --notify) to emit an OSC 777
# desktop-notification up to a notification-aware host (e.g. warden), tying the alert to the agent's
# tab instead of shelling osascript. One tmux layer only — plain `amux` inside warden/ghostty.
# (`amux --frame` nests a second tmux that single-wrapping won't traverse, but the frame is an
# alternative to warden's chrome, not used together, so that case is out of scope.)
set -g allow-passthrough on

# Auto-launch agent in new windows of @autoagent=1 sessions.
# Window 0 is handled by amux directly; this hook covers all subsequent windows.
set-hook -g after-new-window 'run-shell "~/.agentmux/scripts/launch_agent.sh #{window_id} #{pane_id}"'

# (No close hook: tmux's pane-exit hooks fire with the ACTIVE pane's context once
# the pane is gone, so they misattribute and would hide live windows. amux --log
# reconciles a live server against its open windows at read time instead.)

# On attach: recompute status bar colour. -g not -ga to avoid accumulation on reload.
set-hook -g client-attached 'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'
set-hook -g session-created        'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'
set-hook -g client-session-changed 'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'

# prefix-m: cycle @agent-mode through all defined agents (no-op in plain sessions).
bind-key m if -F '#{==:#{@autoagent},1}' \
  { run-shell "~/.agentmux/scripts/cycle_mode.sh '#{session_id}'" } \
  {}

# prefix-x: in @autoagent sessions, killing the last pane respawns + relaunches
# the agent instead of destroying the session. Falls through to default in all
# other cases (multiple panes, multiple windows, non-agentmux sessions).
bind-key x if -F '#{&&:#{==:#{@autoagent},1},#{&&:#{==:#{session_windows},1},#{==:#{window_panes},1}}}' \
  { confirm-before -p "respawn pane #P (and re-launch agent)? (y/n)" \
    { respawn-pane -k ; run-shell "~/.agentmux/scripts/relaunch.sh #{pane_id}" } } \
  { confirm-before -p "kill-pane #P? (y/n)" kill-pane }

# AI summary status lines (4 rows; only active for @autoagent sessions).
# update_colors.sh sets @l2bg/@l2fg per session; falls back to dim grey.
set -g status-format[1] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}] #(~/.agentmux/scripts/summary_rows.sh #{pane_id} 1 #{client_width})"
set -g status-format[2] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}] #(~/.agentmux/scripts/summary_rows.sh #{pane_id} 2 #{client_width})"
set -g status-format[3] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}] #(~/.agentmux/scripts/summary_rows.sh #{pane_id} 3 #{client_width})"
