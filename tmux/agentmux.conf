# agentmux.conf — source from ~/.tmux.conf:
#   source-file ~/.agentmux/tmux/agentmux.conf
#

# Let programs in a pane forward an escape to the OUTER terminal via tmux's passthrough envelope
# (DCS tmux; … ST). Used by the notify hook (scripts/tmux-status.sh --notify) to emit an OSC 777
# desktop-notification up to a notification-aware host (e.g. warden), tying the alert to the agent's
# tab instead of shelling osascript. This is the agent/default socket — the innermost tmux. Under
# `amux --frame` a second tmux (the frame) nests outside this one; the notify hook wraps the escape
# once per nested layer and frame.conf sets allow-passthrough on the frame socket too, so the OSC
# traverses both servers up to the host.
set -g allow-passthrough on

# Extended keys (CSI-u): forward modified/special keys — Escape, Ctrl-C, Shift+Enter —
# to the agent UNCONDITIONALLY. Claude Code (>=2.1.0) enables the kitty keyboard protocol,
# but tmux silently drops the enable request (`CSI > 1 u` — its CSI parser has no `>`
# handler), so at the default `extended-keys off` the negotiation desyncs and Escape/Ctrl-C
# intermittently stop reaching the agent while typing/arrows keep working. `always` bypasses
# the swallowed request (`on` would wait for the request tmux already dropped). The extkeys
# tags let tmux carry CSI-u from the outer terminal: `xterm*` = ghostty/warden (bare agent),
# `screen*` = the outer frame tmux (a framed agent pane presents screen-256color). Under
# `amux --frame` the agent is two tmux deep, so frame.conf sets this too and bin/amux
# re-asserts it on the shared frame socket — mirroring allow-passthrough.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys,screen*:extkeys'

# Auto-launch agent in new windows of @autoagent=1 sessions.
# Window 0 is handled by amux directly; this hook covers all subsequent windows.
set-hook -g after-new-window 'run-shell "~/.agentmux/scripts/launch_agent.sh #{window_id} #{pane_id}"'

# (No close hook: tmux's pane-exit hooks fire with the ACTIVE pane's context once
# the pane is gone, so they misattribute and would hide live windows. amux --log
# reconciles a live server against its open windows at read time instead.)

# On attach: recompute status bar colour. -g not -ga to avoid accumulation on reload.
set-hook -g client-attached 'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'
set-hook -g session-created        'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'
set-hook -g client-session-changed 'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'

# prefix-m: cycle @agent-mode through all defined agents (no-op in plain sessions).
bind-key m if -F '#{==:#{@autoagent},1}' \
  { run-shell "~/.agentmux/scripts/cycle_mode.sh '#{session_id}'" } \
  {}

# prefix-v: one-shot dismiss of the current tab's state emoji (✅/📣/⚡…), leaving
# just the label. The next status hook re-applies an emoji as normal — this only
# clears the badge you're looking at now (e.g. to acknowledge a done/notify tab).
# No-op on a tab that has no emoji. Works in every session (not just @autoagent);
# clear_icon.sh strips emoji-agnostically, so a plain window is left untouched.
bind-key -N "clear this tab's state emoji" v run-shell "sh ~/.agentmux/scripts/clear_icon.sh '#{window_id}'"

# prefix-x: in @autoagent sessions, killing the last pane respawns + relaunches
# the agent instead of destroying the session. Falls through to default in all
# other cases (multiple panes, multiple windows, non-agentmux sessions).
bind-key x if -F '#{&&:#{==:#{@autoagent},1},#{&&:#{==:#{session_windows},1},#{==:#{window_panes},1}}}' \
  { confirm-before -p "respawn pane #P (and re-launch agent)? (y/n)" \
    { respawn-pane -k ; run-shell "~/.agentmux/scripts/relaunch.sh #{pane_id}" } } \
  { confirm-before -p "kill-pane #P? (y/n)" kill-pane }

# AI summary status lines (4 rows; only active for @autoagent sessions).
# update_colors.sh sets @l2bg/@l2fg per session; falls back to dim grey.
# #{socket_path} (arg 4) and #{@amux_runtime_dir} (arg 5) are passed so
# summary_rows.sh finds the file tmux-status.sh wrote: #() commands inherit
# neither $TMUX (needed to fold server identity into the key) nor the writer's
# $XDG_RUNTIME_DIR (needed for the dir). @amux_runtime_dir is published by the
# writer; empty on a server predating it → summary_rows.sh re-derives from env.
set -g status-format[1] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}] #(~/.agentmux/scripts/summary_rows.sh #{pane_id} 1 #{client_width} #{socket_path} #{@amux_runtime_dir})"
set -g status-format[2] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}] #(~/.agentmux/scripts/summary_rows.sh #{pane_id} 2 #{client_width} #{socket_path} #{@amux_runtime_dir})"
set -g status-format[3] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}] #(~/.agentmux/scripts/summary_rows.sh #{pane_id} 3 #{client_width} #{socket_path} #{@amux_runtime_dir})"
