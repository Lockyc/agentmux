# agentmux.conf — source from ~/.tmux.conf:
#   source-file ~/.agentmux/tmux/agentmux.conf
#

# Let programs in a pane forward an escape to the OUTER terminal via tmux's passthrough envelope
# (DCS tmux; … ST). Used by the notify hook (scripts/tmux-status.sh --notify) to emit an OSC 777
# desktop-notification up to a notification-aware host (e.g. warden), tying the alert to the agent's
# tab instead of shelling osascript. This is the agent/default socket — the innermost tmux. Under
# `amux --frame` a second tmux (the frame) nests outside this one; the notify hook wraps the escape
# once per nested layer and frame.conf sets allow-passthrough on the frame socket too, so the OSC
# traverses both servers up to the host.
set -g allow-passthrough on

# Extended keys (CSI-u): forward modified/special keys — Escape, Ctrl-C, Shift+Enter —
# to the agent UNCONDITIONALLY. Claude Code (>=2.1.0) enables the kitty keyboard protocol,
# but tmux silently drops the enable request (`CSI > 1 u` — its CSI parser has no `>`
# handler), so at the default `extended-keys off` the negotiation desyncs and Escape/Ctrl-C
# intermittently stop reaching the agent while typing/arrows keep working. `always` bypasses
# the swallowed request (`on` would wait for the request tmux already dropped). The extkeys
# tags let tmux carry CSI-u from the outer terminal: `xterm*` = ghostty/warden (bare agent),
# `screen*` = the outer frame tmux (a framed agent pane presents screen-256color). Under
# `amux --frame` the agent is two tmux deep, so frame.conf sets this too and bin/amux
# re-asserts it on the shared frame socket — mirroring allow-passthrough.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys,screen*:extkeys'

# Synchronized output (DECSET 2026): without the `sync` feature tmux never brackets its
# redraws in mode 2026, so ghostty (which pauses rendering only inside 2026) tears frames
# and an unfocused surface flashes its hollow cursor mid-redraw. tmux does NOT derive sync
# from the terminfo `Sync` cap, so warden shipping terminfo is necessary but not sufficient.
# `xterm*` = ghostty/warden (a bare, unframed agent → host); `screen*`/`tmux*` = the outer
# frame a framed agent redraws into. Mirrors frame.conf/term.conf (full rationale there).
set -as terminal-features 'xterm*:sync,screen*:sync,tmux*:sync'

# Auto-launch agent in new windows of @autoagent=1 sessions.
# Window 0 is handled by amux directly; this hook covers all subsequent windows.
set-hook -g after-new-window 'run-shell "~/.agentmux/scripts/launch_agent.sh #{window_id} #{pane_id}"'
# Catch window CLOSES for the session-log live-set sidecar (crash recovery):
# re-snapshot the whole live window set on window-unlinked — the closed window is
# already absent from list-windows at this point (verified), so we need not
# identify which pane exited. That's the trap this sidesteps: tmux's pane-exit
# hooks fire with the ACTIVE pane's context once the pane is gone, so a hook that
# tried to name the exited pane would misattribute and hide live windows;
# re-querying the whole set avoids the question entirely. Event-driven, NO
# heartbeat loop. socket_path + pid match what session_log's `open` records.
set-hook -g window-unlinked 'run-shell "~/.agentmux/scripts/session_log.sh snapshot #{socket_path} #{pid}"'

# On attach: recompute status bar colour. -g not -ga to avoid accumulation on reload.
set-hook -g client-attached 'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'
set-hook -g session-created        'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'
set-hook -g client-session-changed 'run-shell "~/.agentmux/scripts/update_colors.sh \"#{session_name}\""'

# prefix-m: cycle @agent-mode through all defined agents (no-op in plain sessions).
bind-key m if -F '#{==:#{@autoagent},1}' \
  { run-shell "~/.agentmux/scripts/cycle_mode.sh '#{session_id}'" } \
  {}

# prefix-v: one-shot dismiss of the current tab's state emoji (✅/📣/⚡…), leaving
# just the label. The next status hook re-applies an emoji as normal — this only
# clears the badge you're looking at now (e.g. to acknowledge a done/notify tab).
# No-op on a tab that has no emoji. Works in every session (not just @autoagent);
# clear_icon.sh strips emoji-agnostically, so a plain window is left untouched.
bind-key -N "clear this tab's state emoji" v run-shell "sh ~/.agentmux/scripts/clear_icon.sh '#{window_id}'"

# prefix-f: fork this tab's agent session into a new tab beside it (Claude Code:
# `claude --resume <uuid> --fork-session`, with the [[agents]] resume program
# swapped in). The uuid comes from the session log, which the agent's adapter
# already records on every working hook — nothing new is captured for this.
#
# agentmux.conf is sourced into your GLOBAL tmux config, so a bare `bind-key f`
# would shadow tmux's default find-window everywhere. The gate takes the key only
# in @autoagent sessions and restores stock find-window elsewhere.
#
# That else branch is tmux's own default for `f`, copied verbatim — don't write it
# from memory (older tmux bound `command-prompt -p "(find-window)" …`, and shipping
# that stale form silently changes the key in every NON-agent session, which is the
# one thing this gate exists to prevent). Re-read the real default before touching it:
#   tmux -L check -f /dev/null new-session -d 'sleep 3' \; list-keys -T prefix | grep ' f '
bind-key -N "fork this tab's agent session into a new tab" f \
  if -F '#{==:#{@autoagent},1}' \
    { run-shell "~/.agentmux/scripts/fork_session.sh '#{window_id}'" } \
    { command-prompt { find-window -Z "%%" } }

# prefix-x: in @autoagent sessions, killing the last pane respawns + relaunches
# the agent instead of destroying the session. Falls through to default in all
# other cases (multiple panes, multiple windows, non-agentmux sessions).
# The respawn itself is relaunch.sh's — do NOT re-add a `respawn-pane -k` here:
# with no shell-command it re-runs the pane's ORIGINAL start command, which on a
# restored/forked tab is the agent's `--resume <id>` line, bringing back the
# session being closed. relaunch.sh respawns into a fresh shell explicitly.
bind-key x if -F '#{&&:#{==:#{@autoagent},1},#{&&:#{==:#{session_windows},1},#{==:#{window_panes},1}}}' \
  { confirm-before -p "respawn pane #P (and re-launch agent)? (y/n)" \
    { run-shell "~/.agentmux/scripts/relaunch.sh #{pane_id}" } } \
  { confirm-before -p "kill-pane #P? (y/n)" kill-pane }

# AI summary status lines (4 rows; only active for @autoagent sessions).
# update_colors.sh sets @l2bg/@l2fg per session; falls back to dim grey.
# PUSHED, not polled: tmux-status.sh renders these on each agent event and sets
# @amux_row1/2/3 (pane options) + refresh-client. These lines only substitute
# those options, so a status redraw spawns NOTHING — no #(), so status-interval
# no longer gates any process spawn. (Previously #(summary_rows.sh …), re-run
# every status-interval per client; it spawned awk/coreutils helpers, and a low
# interval × many panes could exhaust the per-user process table — a fork-storm
# lockup. See CLAUDE.md.) tmux auto-clips each row to the terminal width.
# That invariant binds the NOTES path below identically: never a #() here.
#
# Each row shows the LM summary (@amux_rowN) or, when the pane's @amux_notes
# flag is set, the user's note (@amux_noteN — written by scripts/notes.sh).
# Both are pane options, which is what makes the mode per-tab for free.
#
# #{p400:…} pads the RAW OPTION STRING to 400 characters INSIDE the range so an
# EMPTY row is still clickable — a range covers only rendered characters, so
# without the pad a blank note row would have no click target at all. `p`
# pads the underlying string, not the rendered width: an embedded `#[…]` style
# directive or an escaped `##` in a note consumes characters from that 400-char
# budget without producing a visible column, so the pad's VISIBLE width is
# always <= the literal and shrinks as directives/escapes eat into it (measured:
# the empty-state hint's `#[fg=colour240]` cuts ~200 raw chars down to ~187
# visible). 400 is generously oversized headroom over the ~300-char worst case
# (a hint-style row on a wide note) so the visible remainder still comfortably
# covers a 200-300 column terminal; tmux clips the line to the terminal width
# as usual, so any excess pad is never rendered and costs nothing. The width
# must be a literal (#{p#{client_width}:…} does not expand) and the modifier's
# argument must be an option NAME, not inline text.
set -g status-format[1] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}]#[range=user|amuxnote1] #{?@amux_notes,#{p400:@amux_note1},#{p400:@amux_row1}}#[norange]"
set -g status-format[2] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}]#[range=user|amuxnote2] #{?@amux_notes,#{p400:@amux_note2},#{p400:@amux_row2}}#[norange]"
set -g status-format[3] "#[align=left,fg=#{?@l2fg,#{@l2fg},colour244},bg=#{?@l2bg,#{@l2bg},default},fill=#{?@l2bg,#{@l2bg},default}]#[range=user|amuxnote3] #{?@amux_notes,#{p400:@amux_note3},#{p400:@amux_row3}}#[norange]"

# Click a summary or note row to edit that row's note. range=user|amuxnoteN
# triggers the `Status` mouse key, with N available as #{mouse_status_range}
# (the BARE argument — tmux does not include the `user|` prefix).
#
# The else branch reproduces tmux's DEFAULT MouseDown1Status binding verbatim,
# so clicking a window in the window list (status-format[0], which carries no
# user range) keeps working. Changing it here would break window switching for
# every session on this server — this file is also sourced from ~/.tmux.conf.
#
# Same sourcing-into-global-config footgun as the `f` binding above applies to
# this root-table key itself: a user who already binds their own
# MouseDown1Status (e.g. in ~/.tmux.conf, sourced before or after this file)
# has it silently replaced — whichever binding is set last wins, with no
# warning either way.
#
# This also makes status-format[1..3] clickable for anyone running a
# multi-line status (status 2+) OUTSIDE agentmux — those rows were already
# being overwritten by the AI-summary set above (pre-existing), but they were
# not previously a mouse target. A click there now opens a `note N>` prompt in
# a session that has nothing to do with agentmux. Invisible at the tmux
# default of `status 1`.
#
# The glob is the exact #{m:amuxnote[123],…} — matching only the three ranges
# this config actually emits — not the looser amuxnote* it might look like it
# needs. A looser glob would also match a user-defined range of the same
# shape (amuxnoteX, amuxnote99) and route that click into notes.sh too; but
# notes.sh's `_nt_row` returns nothing for anything outside 1/2/3 and `click`
# then exits 0 WITHOUT falling through to switch-client, so a loose glob would
# silently swallow that click instead of leaving it at the default binding.
#
# -b (background): notes.sh click calls `tmux command-prompt` SYNCHRONOUSLY,
# and command-prompt blocks its caller until the prompt is dismissed (verified:
# returns in 0.01s with no client attached, still blocked after 8s with one) —
# so a bare run-shell here would hold this client's command queue, with every
# queued command behind it, for as long as the user takes to type the note.
bind-key -T root MouseDown1Status if -F '#{m:amuxnote[123],#{mouse_status_range}}' \
  { run-shell -b "sh ~/.agentmux/scripts/notes.sh click '#{pane_id}' '#{mouse_status_range}' '#{client_tty}'" } \
  { switch-client -t = }

# Toggle this tab between the LM summary rows and its notes. `n` is tmux's
# next-window; m/v/f/x are taken by agentmux (mode/clear-icon/fork/relaunch).
# Deliberately ungated on @autoagent, like `v` above: the AI-summary rows only
# ever render in an @autoagent session (status stays off otherwise), so in a
# plain non-agentmux session this key is a harmless no-op — it still flips the
# @amux_notes pane option and issues a refresh-client, but there is no visible
# status row for it to affect.
# No -b: toggle makes no BLOCKING call — nothing here waits on user input the
# way notes.sh click's command-prompt does above. It still forks `sh` plus a
# few `tmux` client processes synchronously (show-options, set-option,
# refresh-client), which is not free (this repo's own measured fork+exec floor
# is 50-250ms under load) but is the same synchronous cost every other
# run-shell in this file already pays (e.g. the prefix-x relaunch above), and
# -b would only reorder its refresh-client relative to the key press for no
# benefit.
bind-key -N "toggle this tab's summary rows between AI summary and notes" N \
  run-shell "sh ~/.agentmux/scripts/notes.sh toggle '#{pane_id}'"
