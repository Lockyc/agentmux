# agent.conf — config for the agentmux AGENT socket (agentmux-agent-<cksum $PWD>).
# Loaded via:  tmux -L agentmux-agent-<hash> -f ~/.agentmux/tmux/agent.conf new-session …
#              (bin/amux's _amux_atmux passes -f on every agent-socket call; tmux only
#               reads it when the call STARTS the server — i.e. the first new-session).
#
# WHY THIS FILE EXISTS — it is the AGENT peer of frame.conf/term.conf.
# The agent socket is a per-project shard, so each project spins up its OWN cold tmux
# server. Before this file, that server was started with no -f, so it fell through to
# ~/.tmux.conf — whose last line is TPM's SYNCHRONOUS `run '~/.tmux/plugins/tpm/tpm'`.
# That blocked every project's first agent launch for seconds while TPM re-sourced all
# plugins into the fresh server — a cost that was invisible pre-sharding only because
# the agent then ran on tmux's already-warm default socket. frame/term dodged it from
# the start by carrying their own -f config; the agent socket was simply never given
# one. This file closes that gap: the agent server sources agentmux.conf directly and
# never runs TPM, so a cold agent start is fast again.
#
# What is intentionally NOT inherited from ~/.tmux.conf: TPM itself and its plugins
# (tmux-sensible, tmux-yank). The genuinely useful behaviour those provided is re-set
# below — tmux-sensible's escape-time/focus-events/history-limit, and tmux-yank's
# copy-mode-to-clipboard — so nothing an agent pane cares about is lost.
#
# What DOES have to be re-set here (learned the hard way): the status-LEFT chip.
# agentmux.conf owns only the summary ROWS (status-format[1..3]) and — via
# update_colors.sh on attach — the per-session status-style / status-right / summary
# shades. It does NOT set `status-left`, which used to come from ~/.tmux.conf. Without
# it a cold agent server falls back to tmux's default `[#{session_name}]` clipped at
# status-left-length 10 — an unstyled bracket chip that also lets a long session name
# spill under the first window tab. So the agent socket must carry its own chip. Every
# session on this socket is an @autoagent session that wants it, so a global set is
# correct — there is no non-agent session here to clobber (contrast agentmux.conf,
# which the user's real ~/.tmux.conf also sources, so a status-left there would hit
# their normal sessions too). The per-window tab format/colour is NOT set here — that
# is agent_window_style.sh's job, applied per agent window.

# The real agentmux behaviour: status rows, agent-launch hooks, mode cycling, the
# prefix bindings, and the allow-passthrough / extended-keys / sync terminal features
# the notify + Escape/Ctrl-C footguns depend on. Absolute ~/.agentmux path (like
# frame.conf) so it resolves regardless of the server's cwd.
source-file ~/.agentmux/tmux/agentmux.conf

# Interactive defaults an agent pane wants, formerly supplied by ~/.tmux.conf +
# tmux-sensible (agentmux.conf sets none of these):
#   escape-time 0    — Escape reaches the agent instantly; a nonzero delay is the
#                      classic "Escape feels laggy/dropped in Claude" cause, adjacent
#                      to the extended-keys footgun. tmux-sensible set this; keep it.
#   focus-events on   — tmux tracks focus, which the client-attached / focus-aware
#                      colour + status hooks rely on. tmux-sensible set this.
#   history-limit     — scrollback for reading agent output. Matches the 50000 both
#                      ~/.tmux.conf and tmux-sensible used.
#   mouse on          — scroll + select in the agent pane (from ~/.tmux.conf).
#   renumber-windows  — agentmux opens/closes/forks agent tabs constantly; without
#                      this, closing a middle tab leaves a numbering gap. From
#                      ~/.tmux.conf — the pre-sharding agent (default socket) had it,
#                      so the shard restores prior behaviour, not new behaviour.
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g renumber-windows on

# Copy-mode → system clipboard. A bare (non-frame) agent shard has NO clipboard
# wiring otherwise: tmux 3.2+ defaults set-clipboard to `external`, so a mouse
# drag-select of scrollback dead-ends in tmux's internal buffer and never reaches
# the macOS clipboard. ~/.tmux.conf supplied this via tmux-yank pre-sharding; the
# shard lost it. Mirrors frame.conf/term.conf's house pattern EXACTLY (set-clipboard
# on for OSC-52-honouring terminals, the pbcopy pipe to guarantee it on macOS). In
# --frame mode the outer frame socket captures the drag first and does this itself;
# this covers the bare agent. It lives here, not in agentmux.conf, because the user's
# real ~/.tmux.conf also sources agentmux.conf (where tmux-yank already binds copy) —
# same reason as the status-left chip below.
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy

# Session-name chip (see the header). A styled, self-contained chip so the agent bar
# doesn't depend on ~/.tmux.conf: white-bold on blue, the session name padded, then
# reset before the window list. Length 24 fits a normal project basename without
# clipping (the default 10 truncated it and let it run under the first tab).
# update_colors.sh still paints the per-session bar bg + status-right on attach.
set -g status-left-length 24
set -g status-left "#[fg=colour231,bg=colour33,bold] #S #[default] "
