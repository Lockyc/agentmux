# agent.conf — config for the agentmux AGENT socket (agentmux-agent-<cksum $PWD>).
# Loaded via:  tmux -L agentmux-agent-<hash> -f ~/.agentmux/tmux/agent.conf new-session …
#              (bin/amux's _amux_atmux passes -f on every agent-socket call; tmux only
#               reads it when the call STARTS the server — i.e. the first new-session).
#
# WHY THIS FILE EXISTS — it is the AGENT peer of frame.conf/term.conf.
# The agent socket is a per-project shard, so each project spins up its OWN cold tmux
# server. Before this file, that server was started with no -f, so it fell through to
# ~/.tmux.conf — whose last line is TPM's SYNCHRONOUS `run '~/.tmux/plugins/tpm/tpm'`.
# That blocked every project's first agent launch for seconds while TPM re-sourced all
# plugins into the fresh server — a cost that was invisible pre-sharding only because
# the agent then ran on tmux's already-warm default socket. frame/term dodged it from
# the start by carrying their own -f config; the agent socket was simply never given
# one. This file closes that gap: the agent server sources agentmux.conf directly and
# never runs TPM, so a cold agent start is fast again.
#
# What is intentionally NOT inherited from ~/.tmux.conf: TPM plugins (tmux-sensible,
# tmux-yank) and personal status-bar styling — agentmux owns the agent status bar
# (status-format rows in agentmux.conf), so that styling was overridden anyway. The
# genuinely useful interactive defaults those provided are re-set below so nothing an
# agent pane cares about is lost.

# The real agentmux behaviour: status rows, agent-launch hooks, mode cycling, the
# prefix bindings, and the allow-passthrough / extended-keys / sync terminal features
# the notify + Escape/Ctrl-C footguns depend on. Absolute ~/.agentmux path (like
# frame.conf) so it resolves regardless of the server's cwd.
source-file ~/.agentmux/tmux/agentmux.conf

# Interactive defaults an agent pane wants, formerly supplied by ~/.tmux.conf +
# tmux-sensible (agentmux.conf sets none of these):
#   escape-time 0    — Escape reaches the agent instantly; a nonzero delay is the
#                      classic "Escape feels laggy/dropped in Claude" cause, adjacent
#                      to the extended-keys footgun. tmux-sensible set this; keep it.
#   focus-events on   — tmux tracks focus, which the client-attached / focus-aware
#                      colour + status hooks rely on. tmux-sensible set this.
#   history-limit     — scrollback for reading agent output. Matches the 50000 both
#                      ~/.tmux.conf and tmux-sensible used.
#   mouse on          — scroll + select in the agent pane (from ~/.tmux.conf).
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on
