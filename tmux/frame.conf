# frame.conf — minimal config for the agentmux `--frame` outer wrapper.
# Loaded via:  tmux -L agentmux-frame -f ~/.agentmux/tmux/frame.conf ...
#
# This is the ONLY config the frame socket reads (no ~/.tmux.conf), so the frame
# stays a bare horizontal split: no status bar, a secondary prefix, a few split
# controls. amux runs UNCHANGED in the right pane on the default tmux socket; its
# own C-b prefix passes straight through because the frame ignores C-b.

# Secondary prefix: C-f by default ('f' for frame). The default C-b is released so
# it falls through to the focused pane (the inner amux client's prefix handles it).
# Override per-user with [frame] prefix in amux.toml (amux re-sets it at launch).
# The inner amux prefix ([amux] prefix) must differ from this — the frame grabs its
# own prefix before the agent pane sees it, so a colliding value never reaches amux.
set -g prefix C-f
unbind C-b

# Outer frame status bar: a thin full-width anchor at the very bottom. On the left,
# an "amux frame" badge (inverted block) followed by <projectdir>/<session>; on the
# right, the clock. The per-pane bars — the left terminal's and amux's — live on
# their own sockets and sit just above it, one under each pane. The window list is
# suppressed (the frame has a single window).
#
# @amux_project is set per-session by bin/amux at frame creation (basename of the
# launch dir); the session name has its -frame suffix stripped to show the amux
# session. status-left styling: badge = dark text on a light block (#[default]
# resets to status-style afterwards).
set -g status on
set -g status-style 'bg=colour236,fg=colour250'
set -g status-left '#[fg=colour236,bg=colour110,bold] amux frame #[default] #{@amux_project}/#{s/-frame$//:session_name} '
set -g status-left-length 80
set -g status-right ' %H:%M '
set -g window-status-format ''
set -g window-status-current-format ''

# Focus events: the frame owns the mouse and is the layer that switches the active
# pane, but the inner term/agent tmux servers run with focus-events ON. Without this
# the frame never tells the inner pane it (re)gained focus when you click across the
# divider, so the inner tmux doesn't wake to the first forwarded click — you click
# once to switch panes and again to actually land in the agent. Emitting focus-in/out
# from the frame lets a single cross-pane click both focus AND register. Must stay
# consistent with the inner servers (default socket + term.conf), which are focus-aware.
set -g focus-events on

# Passthrough: the frame is the OUTERMOST tmux over the agent, so a desktop
# notification (OSC 777) the agent emits arrives here wrapped in a tmux passthrough
# envelope (the notify hook wraps once per nested tmux layer). The frame must forward
# it to the host terminal (warden/Ghostty); with passthrough off — the tmux default —
# it's silently dropped and notifications never arrive. Mirrors the agent socket's
# agentmux.conf. bin/amux also re-asserts this on every `--frame` so a pre-existing
# long-lived frame server (which never re-reads this file) picks it up.
set -g allow-passthrough on

# Extended keys: the frame is the OUTERMOST tmux, so the agent's CSI-u keys (Escape, Ctrl-C,
# Shift+Enter) must traverse it down to the agent pane. Claude Code enables the kitty
# keyboard protocol; tmux drops the enable request, so without `always` the frame collapses
# those keys and Escape/Ctrl-C intermittently die in the agent while typing/arrows survive.
# Mirrors the agent socket (agentmux.conf). Set here for a fresh frame server AND re-asserted
# by bin/amux on every `--frame` — the frame socket is shared and long-lived, so a server
# predating this file never re-reads it (same reasoning as allow-passthrough / focus-events).
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys,screen*:extkeys'

# Synchronized output (DECSET 2026): tmux brackets a redraw in mode 2026 — the signal a
# host terminal uses to pause rendering mid-frame — ONLY when the `sync` feature is on.
# tmux does not derive it from the terminfo `Sync` capability (xterm-ghostty ships Sync,
# yet tmux 3.7 leaves the feature off until it is named here), so warden bundling the
# terminfo is necessary but NOT sufficient — this line is the other half. Without it the
# frame's redraws to the host are unbracketed, ghostty samples half-drawn frames, and an
# unfocused surface repaints its hollow cursor on every torn frame: the "cursor flashes
# around the screen" bug in a background window while a TUI redraws. `xterm*` = ghostty
# (frame→host, the hop that tears); `screen*`/`tmux*` = the outer frame a nested agent
# redraws into. Set here for a fresh server AND re-asserted by bin/amux on every `--frame`,
# same shared-long-lived-frame reasoning as extkeys / allow-passthrough above. Feature is
# computed at client attach, so a pre-existing frame picks it up on the next reattach.
set -as terminal-features 'xterm*:sync,screen*:sync,tmux*:sync'

# Mouse: click panes, drag the divider to resize, drag-select to copy. This frame
# is the OUTERMOST tmux over both panes, so with mouse on it captures every drag —
# the inner term/agent sockets never see it. That means clipboard wiring has to live
# here or a drag-select dead-ends in the frame's internal buffer and never reaches
# the system clipboard. set-clipboard on emits OSC 52 for terminals that honour it;
# the copy-pipe to pbcopy guarantees it on macOS regardless of terminal OSC 52 support.
set -g mouse on
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy

# Fixed layout: drop the default bindings that would create OR destroy ad-hoc
# state. Creation (new windows / extra splits) and destruction (kill-pane /
# kill-window) both break the fixed two-pane layout — a killed frame pane reflows
# to full width and only a relaunch rebuilds it. The left column may be split
# top/bottom at launch via [frame] left_vertical_split (with [frame] left_top_panes
# equal-height shells stacked in the top region), but interactive splits/kills stay
# disabled; quit the whole frame via Q below.
unbind c
unbind '"'
unbind %
unbind x
unbind &

# Focus the panes. h/l cross between the left column and the agent; j/k move
# between the left column's stacked panes when [frame] left_vertical_split is on —
# through the top region's shells and the bottom scratch terminal (harmless no-ops
# when it isn't).
bind -N 'focus terminal (left)'   h     select-pane -L
bind -N 'focus agent (right)'     l     select-pane -R
bind -N 'focus terminal (left)'   Left  select-pane -L
bind -N 'focus agent (right)'     Right select-pane -R
bind -N 'focus left pane below'   j     select-pane -D
bind -N 'focus left pane above'   k     select-pane -U
bind -N 'focus left pane below'   Down  select-pane -D
bind -N 'focus left pane above'   Up    select-pane -U

# Resize the split.
bind -N 'shrink left pane' H resize-pane -L 5
bind -N 'grow left pane'   L resize-pane -R 5

# Reset the split: prefix `0` snaps the divider back to the configured [frame] left %,
# undoing any manual drag (works from either pane — it targets the stored left-column
# pane, not the active one). `0` reads as "reset to default" (cf. Cmd+0) and is safe to
# claim: the frame is single-window (c is unbound above), so tmux's default `0` =
# select-window 0 is inert here. Like the pane-died hook below, this binding is NOT set
# here: it depends on per-session data (@amux_left, @amux_left_pane) and must stay
# current on the shared long-lived frame socket, so bin/amux runs `bind-key 0` (and
# refreshes the data) on every `amux --frame` instead. The command lives there.

# Quit the frame: kill this frame session AND its scratch terminal (the paired
# <name>-term), so quit-then-relaunch starts fresh and picks up config changes
# (e.g. [frame] left). The amux agent on the default socket is left running and can
# be reattached later. The term socket comes from @amux_term_socket, the per-session
# option bin/amux sets on every `amux --frame` — NOT from the environment, which amux
# deliberately no longer exports (a per-project socket in the env rides down into every
# descendant of the frame and re-pins other projects' launches; see bin/amux's header).
# run-shell expands both #{...} formats against the pane the key was pressed in, so a
# frame socket hosting several frame sessions still resolves each to its own term.
bind -N 'quit frame' Q confirm-before -p "kill frame? (y/n)" {
  run-shell 'tmux -L "#{@amux_term_socket}" kill-session -t "#{s/-frame$//:session_name}-term" 2>/dev/null'
  kill-session
}

# (prefix d detaches — tmux default — leaving both sides running.)

# NOTE: the pane-died reattach hook is deliberately NOT set here. This file is
# read only when the frame server first starts, but the frame socket is shared
# and long-lived — a server that predates a hook change would never pick it up.
# bin/amux runs `set-hook -g pane-died` on every `amux --frame` instead, so the
# hook stays current on any running server. It keeps the nested-tmux panes alive
# across an accidental prefix-d (remain-on-exit + @amux_role are set per-pane by
# bin/amux); the re-attach logic lives in scripts/frame_reattach.sh.

# User overlay — your own tmux settings for the FRAME wrapper socket, sourced LAST.
# PER-ROLE: its OWN file, NOT shared with the agent/term overlays — the frame runs a
# different prefix (C-f) and unbinds the window-management keys for its fixed two-pane
# layout, so a binding meant for your agent must never land here (that cross-role leak
# is exactly the bug a single shared overlay caused). Even scoped to the frame, BE
# CONSERVATIVE: rebinding its focus/resize/quit keys or restyling its bar can break
# --frame. The main legitimate use is the clipboard hop — the outer frame socket
# captures a drag-select first, so a custom copy-pipe has to be set here to reach
# --frame copies. `-q` = silent no-op if absent. $AGENTMUX_USER_DIR (exported by bin/amux,
# default ~/.agentmux) makes the path redirectable for selftest isolation.
source-file -q $AGENTMUX_USER_DIR/user.frame.tmux.conf
