# term.conf — minimal config for the agentmux frame's LEFT pane: a dedicated,
# persistent scratch terminal. Loaded via:
#   tmux -L agentmux-term -f ~/.agentmux/tmux/term.conf new-session -A -s <session>-term
#
# Its own tmux server/socket, so it has its own status bar and tab list,
# independent of the agent (default socket) and the frame wrapper (agentmux-frame).
# Prefix stays C-b (tmux default): the frame ignores C-b, so it reaches whichever
# pane is focused — here, this terminal's own tabs.

# Own status / tab bar, styled to match the amux bar (same tab format and
# current/inactive treatment) but with a distinct colour block on the left so the
# scratch terminal reads as separate from the agent.
set -g status on
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left-length 24
set -g status-left '#[fg=colour231,bg=colour22,bold] #S #[default] '
set -g status-right ''
set-window-option -g window-status-current-style fg=black,bg=white,bold
set-window-option -g window-status-style fg=white,bg=black,dim
set-window-option -g window-status-current-format '[#I: #W]'
set-window-option -g window-status-format ' #I: #W '

# Close a middle tab and the ones after it slide down, so the `#I` above stays a
# contiguous 0,1,2… — the same behaviour the agent socket gets (agent.conf), applied
# here because this session supports extra tabs too (C-b c, guarded below). Without
# it the two halves of the frame disagree about what closing a tab does. The frame
# socket needs none: it is single-window and unbinds `c`, so there is nothing to
# renumber.
set -g renumber-windows on

# Passthrough (DCS tmux; … ST): let a program in this pane forward an escape the outer
# terminal understands but tmux does not. The scratch terminal runs arbitrary tools, so
# without it a wrapped escape is swallowed here and its control string leaks into the
# window title. Mirrors agentmux.conf/frame.conf (full rationale in agentmux.conf), which
# is what makes the setting uniform across all three sockets rather than a per-role choice.
# Limit worth knowing before treating this as image support: it buys TRANSIT, not managed
# images. tmux's grid does not track that a kitty-graphics pixel region is occupied, so the
# next line of text draws straight over the image and a scroll or redraw loses it. A
# multiplexer hop cannot own image placement; an out-of-band surface the agent's renderer
# does not control is the shape that works (docs/multiplexer-direction.md).
set -g allow-passthrough on

# Focus events: keep the nested stack uniformly focus-aware. The frame (outer) emits
# focus-in/out as the active pane crosses the divider; this inner server forwards them
# to its shell so a single click lands here instead of one click to focus + one to act.
# Matches frame.conf and the agent's default socket.
set -g focus-events on

# Extended keys: keep the nested stack uniform — the scratch terminal runs interactive TUIs
# (including an agent) that expect CSI-u for Escape/Ctrl-C/Shift+Enter. `always` forwards them
# regardless of the swallowed kitty-enable request; extkeys carries them from the outer layer
# (ghostty `xterm*` standalone, the frame `screen*` when nested). Mirrors agentmux.conf/frame.conf.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys,screen*:extkeys'

# Synchronized output (DECSET 2026): without the `sync` feature tmux never brackets its
# redraws in mode 2026, so ghostty (which pauses rendering only inside 2026) tears frames
# and an unfocused surface flashes its hollow cursor mid-redraw. tmux does NOT derive sync
# from the terminfo `Sync` cap, so warden shipping terminfo is necessary but not sufficient.
# `xterm*` = ghostty standalone; `screen*`/`tmux*` = the outer frame when nested. Mirrors
# agentmux.conf/frame.conf (full rationale there).
set -as terminal-features 'xterm*:sync,screen*:sync,tmux*:sync'

# Hyperlinks (OSC 8): tmux re-emits a hyperlink to the host only when the `hyperlinks`
# feature is on, and derives it from the terminfo `Hls` cap — which xterm-ghostty does not
# ship at all, so it must be named or tmux strips the URL and forwards only the label: a
# silently unclickable link in warden. `xterm*` = ghostty standalone; `screen*` = the outer
# frame when nested. `tmux*` deliberately absent — tmux's built-in tmux-* profile already
# carries hyperlinks. Mirrors agentmux.conf/frame.conf (full rationale there).
set -as terminal-features 'xterm*:hyperlinks,screen*:hyperlinks'

# Mouse: click panes/windows, drag-select to copy. set-clipboard on emits OSC 52
# for terminals that honour it; the copy-pipe to pbcopy guarantees it on macOS
# regardless of terminal OSC 52 support. (In the frame the outer agentmux-frame
# socket captures the drag first — this matters when the term socket is used
# standalone, and keeps both sockets' clipboard policy consistent.)
set -g mouse on
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy

# Always there: when the shell exits, respawn it instead of closing the pane, so
# the left terminal never disappears. remain-on-exit keeps the dead pane in place;
# the pane-died hook brings the shell straight back.
set -g remain-on-exit on
set-hook -g pane-died 'respawn-pane'

# remain-on-exit only catches the shell *exiting*; kill-pane/kill-window tear the
# pane down outright. Killing the LAST pane of the LAST window destroys the whole
# session — and since the frame forwards C-b here, a stray C-b x / C-b & does
# exactly that, taking the frame's left attach with it (dead pane, unrecoverable
# without relaunch). But this session DOES support extra tabs (C-b c), and those
# must stay killable. So guard only the last-pane/last-window case: respawn the
# shell in place instead of destroying the session; any other pane/tab kills
# normally. Mirrors the agent socket's prefix-x relaunch guard (agentmux.conf).
bind-key x if -F '#{&&:#{==:#{session_windows},1},#{==:#{window_panes},1}}' \
  { confirm-before -p "reset scratch terminal? (y/n)" 'respawn-pane -k' } \
  { confirm-before -p "kill-pane #P? (y/n)" kill-pane }
bind-key & if -F '#{==:#{session_windows},1}' \
  { confirm-before -p "reset scratch terminal? (y/n)" 'respawn-pane -k' } \
  { confirm-before -p "kill-window #W? (y/n)" kill-window }

# User overlay — your own tmux settings for the scratch-TERMINAL socket, sourced
# LAST. PER-ROLE: its OWN file, separate from the agent and frame overlays, so a
# binding here stays scoped to the scratch terminal and can't collide with their key
# schemes. This is a general-purpose pane you actually work in and it has no fixed
# layout to protect, so customize freely (vi copy-mode, your scrollback, your
# bindings). `-q` = silent no-op if absent. $AGENTMUX_USER_DIR (exported by bin/amux,
# default ~/.agentmux) makes the path redirectable for selftest isolation.
source-file -q $AGENTMUX_USER_DIR/user.term.tmux.conf
