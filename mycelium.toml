name    = "agentmux"
summary = "A configurable tmux launcher for agent sessions. Define your AI agents — or any CLI — in TOML; each opens in its own colour-coded tmux window and prefix-m cycles between them. Runs in any terminal."
kind    = "tool"
status  = "active"
tags    = ["tmux", "agents", "cli", "launcher"]
stack   = ["bash", "tmux"]

[github]
topics_extra = ["ai-agents", "claude-code", "coding-agents", "llm", "terminal", "session-manager"]

[[provides]]
name    = "agent-sessions"
summary = "Spawns, probes, and kills tmux-backed agent sessions (the warden → agentmux → tmux stack)"
