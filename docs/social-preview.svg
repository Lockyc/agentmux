<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a12"/>
      <stop offset="1" stop-color="#0a0f0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#1f9d34" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#1f9d34" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bgg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="20" y="20" width="1240" height="600" rx="28" fill="none" stroke="#16301f" stroke-width="2"/>

  <!-- terminal window -->
  <svg x="104" y="170" width="300" height="300" viewBox="0 0 300 300">
    <rect x="0" y="0" width="300" height="300" rx="22" fill="#0d1411" stroke="#1f3a29" stroke-width="2"/>
    <circle cx="26" cy="28" r="7" fill="#ff5f56"/>
    <circle cx="50" cy="28" r="7" fill="#ffbd2e"/>
    <circle cx="74" cy="28" r="7" fill="#27c93f"/>

    <g font-family="Menlo, Monaco, monospace">
      <text x="24" y="94" font-size="19" font-weight="700" fill="#3fb950">$ agentmux</text>
      <g font-size="16">
        <circle cx="31" cy="129" r="5" fill="#3fb950"/>
        <text x="46" y="134" fill="#c9d1d9">claude</text>
        <text x="160" y="134" fill="#6e7b8a">running</text>
        <circle cx="31" cy="161" r="5" fill="#58a6ff"/>
        <text x="46" y="166" fill="#c9d1d9">codex</text>
        <text x="160" y="166" fill="#6e7b8a">idle</text>
        <circle cx="31" cy="193" r="5" fill="#d29922"/>
        <text x="46" y="198" fill="#c9d1d9">shell</text>
        <text x="160" y="198" fill="#6e7b8a">ready</text>
      </g>
      <!-- tmux status bar with colour-coded agent tabs -->
      <rect x="16" y="250" width="268" height="32" rx="8" fill="#0a1f12" stroke="#143a20"/>
      <g font-size="13">
        <rect x="24" y="256" width="84" height="20" rx="5" fill="#1f7a35"/>
        <text x="66" y="270" text-anchor="middle" fill="#eafff0">claude</text>
        <rect x="116" y="256" width="72" height="20" rx="5" fill="#1b3a5c"/>
        <text x="152" y="270" text-anchor="middle" fill="#cfe2ff">codex</text>
        <rect x="196" y="256" width="80" height="20" rx="5" fill="#5c3b1b"/>
        <text x="236" y="270" text-anchor="middle" fill="#ffe1bf">shell</text>
      </g>
    </g>
  </svg>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="470" y="278" font-size="104" font-weight="700" fill="#ffffff" letter-spacing="-2">agentmux</text>
    <text x="474" y="344" font-size="33" fill="#9fb3c8">Configurable tmux agent launcher — define agents</text>
    <text x="474" y="388" font-size="33" fill="#9fb3c8">in TOML, auto-launch &amp; colour-code tabs per session.</text>

    <g font-size="26" font-weight="500">
      <g>
        <rect x="472" y="432" width="100" height="50" rx="25" fill="#122a17" stroke="#1f5f30"/>
        <text x="522" y="465" text-anchor="middle" fill="#5fd37a">tmux</text>
      </g>
      <g>
        <rect x="588" y="432" width="104" height="50" rx="25" fill="#122a17" stroke="#1f5f30"/>
        <text x="640" y="465" text-anchor="middle" fill="#5fd37a">TOML</text>
      </g>
      <g>
        <rect x="708" y="432" width="106" height="50" rx="25" fill="#122a17" stroke="#1f5f30"/>
        <text x="761" y="465" text-anchor="middle" fill="#5fd37a">Shell</text>
      </g>
      <g>
        <rect x="830" y="432" width="172" height="50" rx="25" fill="#122a17" stroke="#1f5f30"/>
        <text x="916" y="465" text-anchor="middle" fill="#5fd37a">AI agents</text>
      </g>
    </g>
  </g>
</svg>
